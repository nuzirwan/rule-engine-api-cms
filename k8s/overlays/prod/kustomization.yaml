apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: nzr-rules-engine-prod

namespace: nzr-rules-engine

resources:
  - ../../base

# Override image tags for prod — pin to a specific image digest for
# reproducible deployments per [[ci-cd-and-delivery]]
images:
  - name: nzr-rules-engine
    newTag: "1.0.0"
  - name: nzr-strapi-cms
    newTag: "1.0.0"

patches:
  # Engine: bump resource limits for production traffic
  - target:
      kind: Deployment
      name: engine
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"

  # HPA: enable full scaling range in prod
  - target:
      kind: HorizontalPodAutoscaler
      name: engine
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 10

  # CMS: larger limits + swap emptyDir uploads → PVC
  - target:
      kind: Deployment
      name: cms
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: uploads
          persistentVolumeClaim:
            claimName: cms-uploads

  # engine-config: ensure ADMIN_ENABLED is explicitly set in prod
  - target:
      kind: ConfigMap
      name: engine-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: engine-config
      data:
        ADMIN_ENABLED: "true"
