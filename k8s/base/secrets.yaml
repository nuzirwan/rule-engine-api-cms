# ===========================================================================
# PLACEHOLDER SECRETS — DO NOT APPLY AS-IS IN PRODUCTION
#
# All values are placeholder strings. Replace them with actual values via:
#   - External Secrets Operator (ESO) with ExternalSecret CRDs
#   - AWS SSM Parameter Store: /rule-engine/{env}/engine/{secret-name}
#   - HashiCorp Vault: secret/rule-engine/{env}/engine/{secret-name}
#   - Sealed Secrets (kubeseal)
#
# See k8s/README.md for secret management patterns.
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: engine-secrets
  labels:
    app.kubernetes.io/part-of: nzr-rules-engine
    app.kubernetes.io/component: engine
  annotations:
    # Hint for tooling: rotate quarterly per SECRETS.md
    secret.rotation/frequency: "quarterly"
type: Opaque
stringData:
  # Postgres DSN for engine config store (includes credentials)
  # Format: postgres://user:password@host:5432/dbname?sslmode=disable
  CONFIG_DSN: "REPLACE_WITH_POSTGRES_DSN"
  # Comma-separated operator tokens for /admin endpoints
  # Required when ADMIN_ENABLED=true
  ADMIN_TOKENS: "REPLACE_WITH_ADMIN_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: cms-secrets
  labels:
    app.kubernetes.io/part-of: nzr-rules-engine
    app.kubernetes.io/component: cms
  annotations:
    secret.rotation/frequency: "quarterly"
type: Opaque
stringData:
  # CMS Postgres password
  CMS_DB_PASSWORD: "REPLACE_WITH_CMS_DB_PASSWORD"
  # Strapi security secrets — generate with: openssl rand -base64 32
  # APP_KEYS: comma-separated list of 4 random base64 strings
  APP_KEYS: "REPLACE_WITH_APP_KEYS"
  API_TOKEN_SALT: "REPLACE_WITH_API_TOKEN_SALT"
  ADMIN_JWT_SECRET: "REPLACE_WITH_ADMIN_JWT_SECRET"
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"
  TRANSFER_TOKEN_SALT: "REPLACE_WITH_TRANSFER_TOKEN_SALT"
  # ENCRYPTION_KEY: 32-byte hex key — NEVER rotate without re-encrypting all data
  ENCRYPTION_KEY: "REPLACE_WITH_ENCRYPTION_KEY"
  # Token the CMS uses to authenticate against the engine admin API
  ADMIN_API_OPERATOR_TOKEN: "REPLACE_WITH_OPERATOR_TOKEN"
