# Monitoring overlay — run alongside the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# The main stack must be up first so the nzr-internal network already exists.
# If the main stack uses a custom project name, update the network name field below
# and set COMPOSE_PROJECT_NAME accordingly.

services:

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: nzr-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nzr-internal

  grafana:
    image: grafana/grafana:10.4.2
    container_name: nzr-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - nzr-internal
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  nzr-internal:
    external: true
    name: rule-engine-api_nzr-internal
