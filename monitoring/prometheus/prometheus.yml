global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: nzr-rules-engine

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: nzr-engine
    static_configs:
      - targets:
          - nzr-engine:8080
    metrics_path: /metrics
    scheme: http
